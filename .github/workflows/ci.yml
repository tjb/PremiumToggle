name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: iOS (package and demo)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build package for iOS (Release)
        run: |
          xcodebuild build \
            -scheme PremiumToggle \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator'
      - name: Build demo (Debug)
        working-directory: Example
        run: |
          xcodebuild build \
            -project PremiumToggleDemo.xcodeproj \
            -scheme PremiumToggleDemo \
            -destination 'generic/platform=iOS Simulator'
      - name: Build demo (Release)
        working-directory: Example
        run: |
          xcodebuild build \
            -project PremiumToggleDemo.xcodeproj \
            -scheme PremiumToggleDemo \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator'
